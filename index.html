<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Informatik lernen · 1. Semester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf9;--card:#fff;--ink:#1c1917;--muted:#78716c;--line:#e7e5e4;--soft:#f5f5f4;
  --ok:#3B6D11;--ok-bg:#EAF3DE;--bad:#A32D2D;--bad-bg:#FCEBEB;--miss:#854F0B;--miss-bg:#FAEEDA;
  --fs:#534AB7;--fs-bg:#EEEDFE;--dr:#0F766E;--dr-bg:#E0F2EF;--java:#C2410C;--java-bg:#FDEDE3;--linux:#1D4ED8;--linux-bg:#E3EBFD;--all:#44403c;--all-bg:#f0efed;
  --accent:var(--fs);--accent-bg:var(--fs-bg);--on-accent:#fff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#161514;--card:#1f1e1c;--ink:#f5f5f4;--muted:#a8a29e;--line:#34322f;--soft:#292725;
    --ok:#8BC34A;--ok-bg:#24301a;--bad:#F08080;--bad-bg:#3a1f1f;--miss:#E0A84C;--miss-bg:#3a2e17;
    --fs:#A8A1F0;--fs-bg:#2a2742;--dr:#5EC9BC;--dr-bg:#17312e;--java:#F59563;--java-bg:#3a2519;--linux:#86A8F7;--linux-bg:#1c2742;--all:#d6d3d1;--all-bg:#2c2a28;
    --on-accent:#161514;color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:1.25rem 1rem 4rem}
a{color:inherit}
code,pre{font-family:"JetBrains Mono",ui-monospace,monospace}
code{font-size:.88em;background:var(--soft);padding:.1em .35em;border-radius:4px}
.ov{text-decoration:overline;text-decoration-thickness:1.5px}
button{font:inherit;color:inherit}

/* Header / Breadcrumb */
.top{display:flex;align-items:center;flex-wrap:wrap;gap:.35rem .5rem;margin-bottom:1.75rem;font-size:14px}
.top a{text-decoration:none;color:var(--muted)}
.top a:hover{color:var(--ink)}
.top .brand{font-weight:700;color:var(--ink)}
.top .sep{color:var(--muted);opacity:.5}
.top .cur{color:var(--ink);font-weight:500}

/* Home */
.hero h1{font-size:clamp(27px,6vw,38px);line-height:1.15;letter-spacing:-.02em;font-weight:700;margin-bottom:.6rem}
.hero p{color:var(--muted);font-size:16px;max-width:56ch;margin-bottom:1.75rem}
.subjects{display:grid;gap:14px}
.subj{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.25rem;border-left:5px solid var(--c);transition:transform .12s,box-shadow .12s}
.subj:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.06)}
.subj h2{font-size:19px;font-weight:600;letter-spacing:-.01em;display:flex;justify-content:space-between;gap:1rem}
.subj h2 span{color:var(--c);font-size:15px}
.subj .sub{color:var(--muted);font-size:14px;margin:.2rem 0 .6rem}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.mix{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border:1px dashed var(--line);border-radius:14px}
.mix p{font-size:14px;color:var(--muted)}
.foot{margin-top:3rem;font-size:13px;color:var(--muted);text-align:center}
.foot a{color:var(--muted)}

/* Buttons / Pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500;text-decoration:none;border:1px solid var(--line);background:var(--card);cursor:pointer}
.pill:hover{background:var(--soft)}
.pill.pr{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill.pr:hover{filter:brightness(1.08)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Subject / Topic header */
.th{margin-bottom:1.1rem}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-bg);padding:3px 10px;border-radius:999px;margin-bottom:.5rem}
.th h1{font-size:clamp(24px,5vw,32px);letter-spacing:-.02em;line-height:1.2}
.th .src{font-size:13px;color:var(--muted);margin-top:.35rem}
.note{font-size:14px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:.75rem 1rem;margin-bottom:1.25rem}
.actions{margin-bottom:1.5rem}

/* Topic list */
.topics{display:grid;gap:10px}
.topic{display:flex;gap:14px;align-items:flex-start;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem 1.1rem;transition:border-color .12s}
.topic:hover{border-color:var(--accent)}
.num{flex-shrink:0;width:30px;height:30px;border-radius:8px;background:var(--accent-bg);color:var(--accent);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.topic h3{font-size:16px;font-weight:600;line-height:1.35}
.topic .meta{font-size:13px;color:var(--muted);margin-top:.15rem}
.topic .best{font-size:12px;font-weight:600;color:var(--ok)}

.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:1.25rem;width:fit-content;max-width:100%;overflow-x:auto}
.tabs a{padding:7px 18px;border-radius:9px;font-size:14px;font-weight:500;text-decoration:none;color:var(--muted);white-space:nowrap}
.tabs a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

details.kat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.75rem 1rem;margin-bottom:1.25rem;font-size:14px}
details.kat summary{cursor:pointer;font-weight:600}
details.kat ul{margin:.6rem 0 0 1.2rem;color:var(--muted)}
details.kat li{margin-bottom:.25rem}

.pn{display:flex;justify-content:space-between;gap:10px;margin-top:2rem;flex-wrap:wrap}
.pn a{flex:1;min-width:200px;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:.7rem 1rem;font-size:14px;background:var(--card)}
.pn a:hover{border-color:var(--accent)}
.pn small{display:block;color:var(--muted);font-size:12px}
.pn .nx{text-align:right}

/* Glossary */
.gtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:1rem}
.search{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.terms{display:grid;gap:10px}
.term{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.85rem 1.1rem}
.term dt{font-weight:600;font-size:15px;color:var(--accent)}
.term dd{font-size:14.5px;margin-top:.25rem}
.term .ex2{display:block;color:var(--muted);font-size:13.5px;margin-top:.35rem}
.hide .term{cursor:pointer}
.hide .term:not(.open) dd{filter:blur(6px);opacity:.5;user-select:none}
.hide .term:not(.open)::after{content:"Tippen zum Aufdecken";display:block;font-size:12px;color:var(--muted);margin-top:.35rem}
.empty{color:var(--muted);font-size:14px;padding:1rem 0}

/* Symbols */
.sgroup{margin-bottom:1.5rem}
.sgroup h2{font-size:15px;font-weight:600;margin-bottom:.5rem;color:var(--accent)}
.sym{display:grid;grid-template-columns:minmax(90px,170px) 1fr;gap:.2rem 1rem;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.65rem 1rem;margin-bottom:6px;align-items:baseline}
.sym .s{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:16px;font-weight:500;word-break:break-word;grid-row:span 3}
.sym .n{font-weight:600;font-size:14.5px}
.sym .m{font-size:14px;color:var(--muted)}
.sym .x{font-size:13px}
@media (max-width:520px){.sym{grid-template-columns:1fr}.sym .s{grid-row:auto}}

/* Quiz */
.pb{height:5px;background:var(--line);border-radius:3px;margin-bottom:1.1rem;overflow:hidden}
.pf{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem;gap:8px;flex-wrap:wrap}
.qn{font-size:13px;color:var(--muted)}
.qtag{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem}
.qt{font-size:16.5px;line-height:1.55;font-weight:500;margin-bottom:.4rem}
.hint{font-size:13px;color:var(--muted);margin-bottom:1rem}
pre.code{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:.85rem 1rem;font-size:13.5px;line-height:1.55;overflow-x:auto;margin:.25rem 0 1rem}
.os{display:flex;flex-direction:column;gap:8px;margin-bottom:1.1rem}
.op{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card);text-align:left;width:100%;font-size:15px;line-height:1.45}
.op:hover:not(:disabled){background:var(--soft)}
.op:disabled{cursor:default}
.ol{font-size:13px;font-weight:600;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:5px;color:var(--muted);flex-shrink:0;margin-top:1px}
.single .ol{border-radius:50%}
.op.sel{background:var(--accent-bg);border-color:var(--accent)}
.op.sel .ol{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.op.cor{background:var(--ok-bg);border-color:var(--ok)}
.op.cor .ol{border-color:var(--ok);background:var(--ok);color:var(--on-accent)}
.op.wrg{background:var(--bad-bg);border-color:var(--bad)}
.op.wrg .ol{border-color:var(--bad);background:var(--bad);color:var(--on-accent)}
.op.mis{background:var(--miss-bg);border-color:var(--miss)}
.op.mis .ol{border-color:var(--miss);color:var(--miss)}
.ac{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 22px;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--card);text-decoration:none}
.btn:hover:not(:disabled){background:var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pr{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pr:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.fb{font-size:14px;font-weight:600}
.fb.y{color:var(--ok)}.fb.n{color:var(--bad)}
.ex{background:var(--soft);border-radius:10px;padding:.9rem 1.1rem;margin-top:1rem;font-size:14.5px;line-height:1.6}
.ex b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:.75rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Result */
.res{text-align:center;padding:1.25rem 0}
.rs{font-size:56px;font-weight:700;color:var(--accent);letter-spacing:-.03em;line-height:1}
.rl{color:var(--muted);margin:.5rem 0 1.5rem}
.rb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.me{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem;text-align:left}
.mv{font-size:22px;font-weight:600}
.ml{font-size:12px;color:var(--muted)}
.res .ac{justify-content:center}
.wl{text-align:left;margin-top:2rem}
.wl h3{font-size:15px;margin-bottom:.6rem}
.wl li{font-size:14px;margin:0 0 .6rem 1.2rem;color:var(--muted)}
.wl li small{display:block;font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="daten-fs.js"></script>
<script src="daten-dr.js"></script>
<script src="daten-java.js"></script>
<script src="daten-linux.js"></script>
<script>
var ORDER = ["fs","dr","java","linux"];
var L = "ABCDEFGH";
var app = document.getElementById("app");

/* ---------- Helpers ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function ov(h){return h.replace(/([^\u0305])\u0305/g,'<span class="ov">$1</span>')}
function fmt(s){return ov(esc(s).replace(/`([^`]+)`/g,"<code>$1</code>"))}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem("ilern_"+k));localStorage.setItem("ilern_"+k,JSON.stringify(v))}catch(e){return null}}
function setAccent(id){var r=document.documentElement.style;r.setProperty("--accent","var(--"+id+")");r.setProperty("--accent-bg","var(--"+id+"-bg)")}
function count(f,key){return FACH[f].themen.reduce(function(s,t){return s+t[key].length},0)}
function topicIdx(f,tid){var th=FACH[f].themen;for(var i=0;i<th.length;i++)if(th[i].id===tid)return i;return -1}
function crumbs(parts){
  var h='<nav class="top"><a class="brand" href="#/">Informatik lernen</a>';
  parts.forEach(function(p,i){h+='<span class="sep">›</span>'+(p[1]&&i<parts.length-1?'<a href="'+p[1]+'">'+esc(p[0])+'</a>':'<span class="cur">'+esc(p[0])+'</span>')});
  return h+'</nav>';
}

/* ---------- Home ---------- */
function home(){
  setAccent("fs");
  var h = '<nav class="top"><span class="brand">Informatik lernen</span><span class="sep">·</span><span>1. Semester</span></nav>';
  h += '<div class="hero"><h1>Begriffe, Zeichen und Quizfragen – nach deinen Unterlagen.</h1><p>Jedes Fach ist in Themen aufgeteilt, so wie die Foliensätze bzw. Skript-Kapitel. Zu jedem Thema gibt es die Begriffe zum Nachlesen und ein Quiz mit Erklärung, warum was richtig ist.</p></div><div class="subjects">';
  ORDER.forEach(function(f){
    var F=FACH[f];
    h += '<a class="subj" href="#/'+f+'" style="--c:var(--'+f+')"><h2>'+esc(F.name)+'<span>→</span></h2><p class="sub">'+esc(F.sub)+'</p><div class="stats">'+
      '<span class="stat">'+F.themen.length+' Themen</span><span class="stat">'+count(f,"terms")+' Begriffe</span><span class="stat">'+count(f,"quiz")+' Fragen</span>'+
      (F.zeichen?'<span class="stat">Zeichen & Symbole</span>':'')+'</div></a>';
  });
  var n = ORDER.reduce(function(s,f){return s+count(f,"quiz")},0), ba=store("best_all");
  h += '</div><div class="mix" style="--accent:var(--all);--accent-bg:var(--all-bg)"><p><b style="color:var(--ink)">Alles gemischt</b> – '+n+' Fragen aus allen Fächern'+(ba!=null?' · Bestes: '+ba+' %':'')+'</p><a class="pill pr" href="#/alle/quiz">Mix-Quiz starten</a></div>';
  h += '<p class="foot">Auch hier: <a href="biochemie_quiz.html">Biochemie-Quizzes</a></p>';
  app.innerHTML = h;
}

/* ---------- Subject ---------- */
function subject(f){
  setAccent(f);
  var F=FACH[f], bf=store("best_"+f);
  var h = crumbs([[F.name]]);
  h += '<div class="th"><span class="tag">Fach</span><h1>'+esc(F.name)+'</h1></div>';
  if(F.hinweis) h += '<p class="note">'+fmt(F.hinweis)+'</p>';
  h += '<div class="row actions">'+(F.zeichen?'<a class="pill" href="#/'+f+'/zeichen">Zeichen & Symbole</a>':'')+
       '<a class="pill pr" href="#/'+f+'/quiz">Alle '+count(f,"quiz")+' Fragen mischen</a>'+(bf!=null?'<span class="stat">Bestes: '+bf+' %</span>':'')+'</div>';
  h += '<div class="topics">';
  F.themen.forEach(function(t,i){
    var b=store("best_"+f+"_"+t.id);
    h += '<a class="topic" href="#/'+f+'/'+t.id+'"><span class="num">'+(i+1)+'</span><div><h3>'+esc(t.name)+'</h3>'+
      '<p class="meta">'+t.terms.length+' Begriffe · '+t.quiz.length+' Fragen'+(t.kat?' · '+t.kat.length+'× Fragenkatalog':'')+' · '+esc(t.quelle)+'</p>'+
      (b!=null?'<p class="best">Bestes Quiz-Ergebnis: '+b+' %</p>':'')+'</div></a>';
  });
  h += '</div>';
  app.innerHTML = h;
}

/* ---------- Topic header ---------- */
function topicHead(f,i,view){
  var F=FACH[f], t=F.themen[i];
  var h = crumbs([[F.name,"#/"+f],[t.name]]);
  h += '<div class="th"><span class="tag">Thema '+(i+1)+' von '+F.themen.length+'</span><h1>'+esc(t.name)+'</h1><p class="src">Quelle: '+esc(t.quelle)+'</p></div>';
  h += '<nav class="tabs"><a'+(view==="b"?' class="on"':'')+' href="#/'+f+'/'+t.id+'">Begriffe ('+t.terms.length+')</a><a'+(view==="q"?' class="on"':'')+' href="#/'+f+'/'+t.id+'/quiz">Quiz ('+t.quiz.length+')</a></nav>';
  return h;
}
function prevNext(f,i,suffix){
  var th=FACH[f].themen, h='<div class="pn">';
  if(i>0) h+='<a href="#/'+f+'/'+th[i-1].id+suffix+'"><small>← vorheriges Thema</small>'+esc(th[i-1].name)+'</a>';
  if(i<th.length-1) h+='<a class="nx" href="#/'+f+'/'+th[i+1].id+suffix+'"><small>nächstes Thema →</small>'+esc(th[i+1].name)+'</a>';
  return h+'</div>';
}

/* ---------- Glossary ---------- */
var hideDefs = false;
function glossary(f,i){
  setAccent(f);
  var t=FACH[f].themen[i];
  var h = topicHead(f,i,"b");
  if(t.kat) h += '<details class="kat"><summary>Fragenkatalog: '+t.kat.length+' Prüfungspunkt'+(t.kat.length>1?'e':'')+' zu diesem Thema</summary><ul>'+t.kat.map(function(k){return '<li>'+esc(k)+'</li>'}).join("")+'</ul></details>';
  h += '<div class="gtools"><input class="search" id="s" type="search" placeholder="Begriff suchen …" autocomplete="off">'+
       '<label class="toggle"><input type="checkbox" id="hd"'+(hideDefs?' checked':'')+'> Erklärungen verdecken</label></div>'+
       '<dl class="terms'+(hideDefs?' hide':'')+'" id="tl"></dl>';
  h += '<div class="ac" style="margin-top:1.5rem"><a class="btn pr" href="#/'+f+'/'+t.id+'/quiz">Quiz zu diesem Thema starten</a></div>';
  h += prevNext(f,i,"");
  app.innerHTML = h;
  var tl=document.getElementById("tl"), s=document.getElementById("s");
  function draw(){
    var q=s.value.trim().toLowerCase();
    var list=t.terms.filter(function(x){return !q||(x.join(" ")).toLowerCase().indexOf(q)>=0});
    tl.innerHTML = list.length ? list.map(function(x){
      return '<div class="term"><dt>'+ov(esc(x[0]))+'</dt><dd>'+fmt(x[1])+(x[2]?'<span class="ex2">Beispiel: '+fmt(x[2])+'</span>':'')+'</dd></div>';
    }).join("") : '<p class="empty">Kein Begriff gefunden.</p>';
  }
  s.oninput=draw;
  document.getElementById("hd").onchange=function(){hideDefs=this.checked;tl.classList.toggle("hide",hideDefs);tl.querySelectorAll(".open").forEach(function(e){e.classList.remove("open")})};
  tl.onclick=function(e){var c=e.target.closest(".term");if(c&&hideDefs)c.classList.toggle("open")};
  draw();
}

/* ---------- Symbols ---------- */
function symbols(f){
  setAccent(f);
  var F=FACH[f];
  var h = crumbs([[F.name,"#/"+f],["Zeichen & Symbole"]]);
  h += '<div class="th"><span class="tag">Nachschlagen</span><h1>Zeichen & Symbole</h1><p class="src">'+esc(F.name)+' – Schreibweisen aus den Unterlagen</p></div>';
  h += '<div class="gtools"><input class="search" id="s" type="search" placeholder="Zeichen oder Bedeutung suchen …" autocomplete="off"></div><div id="sl"></div>';
  app.innerHTML = h;
  var sl=document.getElementById("sl"), s=document.getElementById("s");
  function draw(){
    var q=s.value.trim().toLowerCase(), out="";
    F.zeichen.forEach(function(g){
      var rows=g.rows.filter(function(r){return !q||(r.join(" ")+" "+g.g).toLowerCase().indexOf(q)>=0});
      if(!rows.length) return;
      out+='<section class="sgroup"><h2>'+esc(g.g)+'</h2>'+rows.map(function(r){
        return '<div class="sym"><div class="s">'+ov(esc(r[0]))+'</div><div class="n">'+ov(esc(r[1]))+'</div>'+
          (r[2]?'<div class="m">'+ov(esc(r[2]))+'</div>':'')+(r[3]?'<div class="x">Beispiel: <code>'+ov(esc(r[3]))+'</code></div>':'')+'</div>';
      }).join("")+'</section>';
    });
    sl.innerHTML = out || '<p class="empty">Nichts gefunden.</p>';
  }
  s.oninput=draw; draw();
}

/* ---------- Quiz ---------- */
var S;
function buildPool(scope){
  var pool=[];
  function add(f,t){t.quiz.forEach(function(q){pool.push({q:q,f:f,t:t})})}
  if(scope.all) ORDER.forEach(function(f){FACH[f].themen.forEach(function(t){add(f,t)})});
  else if(scope.i==null) FACH[scope.f].themen.forEach(function(t){add(scope.f,t)});
  else add(scope.f,FACH[scope.f].themen[scope.i]);
  return pool;
}
function quiz(scope, onlyWrong){
  setAccent(scope.all?"all":scope.f);
  var pool = onlyWrong || buildPool(scope);
  pool = shuffle(pool).map(function(p){return {q:p.q,f:p.f,t:p.t,idx:shuffle(p.q.o.map(function(_,i){return i}))}});
  S={scope:scope,list:pool,i:0,sel:[],done:false,right:0,wrong:[],retry:!!onlyWrong};
  drawQ();
}
function quizHead(){
  var sc=S.scope;
  if(sc.all) return crumbs([["Alles gemischt"]])+'<div class="th"><span class="tag">Quiz</span><h1>Alles gemischt</h1></div>';
  var F=FACH[sc.f];
  if(sc.i==null) return crumbs([[F.name,"#/"+sc.f],["Fach-Quiz"]])+'<div class="th"><span class="tag">Quiz · alle Themen</span><h1>'+esc(F.name)+'</h1></div>';
  return topicHead(sc.f,sc.i,"q");
}
function bestKey(){var sc=S.scope;return sc.all?"best_all":sc.i==null?"best_"+sc.f:"best_"+sc.f+"_"+FACH[sc.f].themen[sc.i].id}
function drawQ(){
  var it=S.list[S.i], q=it.q, multi=q.c.length>1, sc=S.scope;
  var h=quizHead();
  h+='<div class="pb"><div class="pf" style="width:'+(S.i/S.list.length*100)+'%"></div></div>';
  h+='<div class="qh"><span class="qn">Frage '+(S.i+1)+' von '+S.list.length+'</span>';
  if(sc.all||sc.i==null) h+='<span class="qtag" style="color:var(--'+it.f+');background:var(--'+it.f+'-bg)">'+(sc.all?esc(FACH[it.f].kurz)+' · ':'')+esc(it.t.name)+'</span>';
  h+='</div><div class="qcard"><p class="qt">'+fmt(q.q)+'</p>';
  h+='<p class="hint">'+(multi?'Mehrere Antworten richtig – wähle alle passenden.':'Eine Antwort ist richtig.')+'</p>';
  if(q.code) h+='<pre class="code">'+esc(q.code)+'</pre>';
  h+='<div class="os'+(multi?'':' single')+'">';
  it.idx.forEach(function(oi,pos){
    var cls="op";
    if(S.done){var isC=q.c.indexOf(oi)>=0, isS=S.sel.indexOf(oi)>=0; cls+=isC&&isS?" cor":isC?" mis":isS?" wrg":"";}
    else if(S.sel.indexOf(oi)>=0) cls+=" sel";
    h+='<button class="'+cls+'" data-o="'+oi+'"'+(S.done?' disabled':'')+'><span class="ol">'+L[pos]+'</span><span>'+fmt(q.o[oi])+'</span></button>';
  });
  h+='</div><div class="ac">';
  if(!S.done) h+='<button class="btn pr" id="chk"'+(S.sel.length?'':' disabled')+'>Prüfen</button>';
  else h+='<button class="btn pr" id="nx">'+(S.i<S.list.length-1?'Weiter →':'Ergebnis ansehen')+'</button><span class="fb '+(S.lastOk?'y':'n')+'">'+(S.lastOk?'✓ Richtig!':'✗ Nicht ganz')+'</span>';
  h+='</div>';
  if(S.done){
    h+='<div class="ex"><b>Erklärung</b>'+fmt(q.e)+'</div>';
    if(!S.lastOk) h+='<div class="legend"><span><i style="background:var(--ok)"></i>richtig gewählt</span><span><i style="background:var(--miss)"></i>übersehen</span><span><i style="background:var(--bad)"></i>falsch gewählt</span></div>';
  }
  h+='</div>';
  app.innerHTML=h;
  app.querySelectorAll(".op").forEach(function(b){b.onclick=function(){
    var o=+b.dataset.o, k=S.sel.indexOf(o);
    if(multi){ if(k>=0)S.sel.splice(k,1); else S.sel.push(o); } else S.sel=[o];
    drawQ();
  }});
  var chk=document.getElementById("chk"); if(chk) chk.onclick=check;
  var nx=document.getElementById("nx"); if(nx) nx.onclick=next;
}
function check(){
  var it=S.list[S.i], q=it.q;
  var ok=S.sel.length===q.c.length && q.c.every(function(c){return S.sel.indexOf(c)>=0});
  S.lastOk=ok; S.done=true;
  if(ok) S.right++; else S.wrong.push(it);
  drawQ();
}
function next(){
  if(S.i<S.list.length-1){S.i++;S.sel=[];S.done=false;drawQ();window.scrollTo(0,0)}
  else result();
}
function result(){
  var sc=S.scope, n=S.list.length, pct=Math.round(S.right/n*100);
  if(!S.retry){var k=bestKey(), prev=store(k); if(prev==null||pct>prev) store(k,pct);}
  var msg=pct>=90?"Ausgezeichnet!":pct>=70?"Sehr gut – fast alles sitzt.":pct>=50?"Gute Basis – schau dir die falschen Fragen nochmal an.":"Dranbleiben – am Anfang ist alles neu. Lies die Begriffe nochmal und versuch’s erneut!";
  var h=quizHead()+'<div class="res"><div class="rs">'+pct+' %</div><p class="rl">'+msg+(S.retry?' (Wiederholungsrunde)':'')+'</p>'+
    '<div class="rb"><div class="me"><div class="mv">'+S.right+'</div><div class="ml">richtig</div></div><div class="me"><div class="mv">'+S.wrong.length+'</div><div class="ml">falsch</div></div><div class="me"><div class="mv">'+n+'</div><div class="ml">Fragen</div></div></div>'+
    '<div class="ac">'+(S.wrong.length?'<button class="btn pr" id="rw">Falsche wiederholen</button>':'')+'<button class="btn'+(S.wrong.length?'':' pr')+'" id="ra">Neu starten</button>'+
    (sc.i!=null&&!sc.all?'<a class="btn" href="#/'+sc.f+'/'+FACH[sc.f].themen[sc.i].id+'">Begriffe ansehen</a>':'')+'</div>';
  if(S.wrong.length){
    h+='<div class="wl"><h3>Diese Fragen solltest du dir nochmal anschauen:</h3><ul>'+S.wrong.map(function(w){
      return '<li>'+fmt(w.q.q)+(w.q.code?' <code>'+esc(w.q.code.split("\n")[0])+(w.q.code.indexOf("\n")>=0?' …':'')+'</code>':'')+
        '<small>'+esc(FACH[w.f].kurz)+' · <a href="#/'+w.f+'/'+w.t.id+'">'+esc(w.t.name)+'</a></small></li>'}).join("")+'</ul></div>';
  }
  h+='</div>';
  if(sc.i!=null&&!sc.all) h+=prevNext(sc.f,sc.i,"/quiz");
  app.innerHTML=h; window.scrollTo(0,0);
  var wrong=S.wrong;
  var rw=document.getElementById("rw"); if(rw) rw.onclick=function(){quiz(sc,wrong)};
  document.getElementById("ra").onclick=function(){quiz(sc)};
}

/* ---------- Router ---------- */
function route(){
  var p=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  var f=p[0];
  if(f==="alle"&&p[1]==="quiz") quiz({all:true});
  else if(FACH[f]){
    if(!p[1]) subject(f);
    else if(p[1]==="zeichen"&&FACH[f].zeichen) symbols(f);
    else if(p[1]==="quiz") quiz({f:f});
    else { var i=topicIdx(f,p[1]); if(i<0) subject(f); else if(p[2]==="quiz") quiz({f:f,i:i}); else glossary(f,i); }
  }
  else home();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>

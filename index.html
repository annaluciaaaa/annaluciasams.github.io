<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Informatik lernen · 1. Semester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf9;--card:#fff;--ink:#1c1917;--muted:#78716c;--line:#e7e5e4;--soft:#f5f5f4;
  --ok:#3B6D11;--ok-bg:#EAF3DE;--bad:#A32D2D;--bad-bg:#FCEBEB;--miss:#854F0B;--miss-bg:#FAEEDA;
  --fs:#534AB7;--fs-bg:#EEEDFE;--dr:#0F766E;--dr-bg:#E0F2EF;--java:#C2410C;--java-bg:#FDEDE3;--linux:#1D4ED8;--linux-bg:#E3EBFD;--all:#44403c;--all-bg:#f0efed;
  --accent:var(--fs);--accent-bg:var(--fs-bg);--on-accent:#fff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#161514;--card:#1f1e1c;--ink:#f5f5f4;--muted:#a8a29e;--line:#34322f;--soft:#292725;
    --ok:#8BC34A;--ok-bg:#24301a;--bad:#F08080;--bad-bg:#3a1f1f;--miss:#E0A84C;--miss-bg:#3a2e17;
    --fs:#A8A1F0;--fs-bg:#2a2742;--dr:#5EC9BC;--dr-bg:#17312e;--java:#F59563;--java-bg:#3a2519;--linux:#86A8F7;--linux-bg:#1c2742;--all:#d6d3d1;--all-bg:#2c2a28;
    --on-accent:#161514;color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:1.25rem 1rem 4rem}
a{color:inherit}
code,pre,.codebox,.vr,.cons,.infields input{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
code{font-size:.88em;background:var(--soft);padding:.1em .35em;border-radius:4px}
.ov{text-decoration:overline;text-decoration-thickness:1.5px}
button{font:inherit;color:inherit}

/* Header / Breadcrumb */
.top{display:flex;align-items:center;flex-wrap:wrap;gap:.35rem .5rem;margin-bottom:1.75rem;font-size:14px}
.top a{text-decoration:none;color:var(--muted)}
.top a:hover{color:var(--ink)}
.top .brand{font-weight:700;color:var(--ink)}
.top .sep{color:var(--muted);opacity:.5}
.top .cur{color:var(--ink);font-weight:500}

/* Home */
.hero h1{font-size:clamp(27px,6vw,38px);line-height:1.15;letter-spacing:-.02em;font-weight:700;margin-bottom:.6rem}
.hero p{color:var(--muted);font-size:16px;max-width:56ch;margin-bottom:1.75rem}
.subjects{display:grid;gap:14px}
.subj{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.25rem;border-left:5px solid var(--c);transition:transform .12s,box-shadow .12s}
.subj:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.06)}
.subj h2{font-size:19px;font-weight:600;letter-spacing:-.01em;display:flex;justify-content:space-between;gap:1rem}
.subj h2 span{color:var(--c);font-size:15px}
.subj .sub{color:var(--muted);font-size:14px;margin:.2rem 0 .6rem}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.mix{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border:1px dashed var(--line);border-radius:14px}
.mix p{font-size:14px;color:var(--muted)}
.foot{margin-top:3rem;font-size:13px;color:var(--muted);text-align:center}
.foot a{color:var(--muted)}

/* Buttons / Pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500;text-decoration:none;border:1px solid var(--line);background:var(--card);cursor:pointer}
.pill:hover{background:var(--soft)}
.pill.pr{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill.pr:hover{filter:brightness(1.08)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Subject / Topic header */
.th{margin-bottom:1.1rem}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-bg);padding:3px 10px;border-radius:999px;margin-bottom:.5rem}
.th h1{font-size:clamp(24px,5vw,32px);letter-spacing:-.02em;line-height:1.2}
.th .src{font-size:13px;color:var(--muted);margin-top:.35rem}
.note{font-size:14px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:.75rem 1rem;margin-bottom:1.25rem}
.actions{margin-bottom:1.5rem}

/* Topic list */
.topics{display:grid;gap:10px}
.topic{display:flex;gap:14px;align-items:flex-start;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem 1.1rem;transition:border-color .12s}
.topic:hover{border-color:var(--accent)}
.num{flex-shrink:0;width:30px;height:30px;border-radius:8px;background:var(--accent-bg);color:var(--accent);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.topic h3{font-size:16px;font-weight:600;line-height:1.35}
.topic .meta{font-size:13px;color:var(--muted);margin-top:.15rem}
.topic .best{font-size:12px;font-weight:600;color:var(--ok)}

.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:1.25rem;width:fit-content;max-width:100%;overflow-x:auto}
.tabs a{padding:7px 18px;border-radius:9px;font-size:14px;font-weight:500;text-decoration:none;color:var(--muted);white-space:nowrap}
.tabs a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

details.kat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.75rem 1rem;margin-bottom:1.25rem;font-size:14px}
details.kat summary{cursor:pointer;font-weight:600}
details.kat ul{margin:.6rem 0 0 1.2rem;color:var(--muted)}
details.kat li{margin-bottom:.25rem}

.pn{display:flex;justify-content:space-between;gap:10px;margin-top:2rem;flex-wrap:wrap}
.pn a{flex:1;min-width:200px;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:.7rem 1rem;font-size:14px;background:var(--card)}
.pn a:hover{border-color:var(--accent)}
.pn small{display:block;color:var(--muted);font-size:12px}
.pn .nx{text-align:right}

/* Glossary */
.gtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:1rem}
.search{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.terms{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.term{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.85rem 1.1rem}
.term dt{font-weight:600;font-size:15px;color:var(--accent)}
.term dd{font-size:14.5px;margin-top:.25rem;white-space:pre-line}
.term pre.code{white-space:pre;margin:.6rem 0 0}
.term .ex2{display:block;color:var(--muted);font-size:13.5px;margin-top:.35rem}
.hide .term{cursor:pointer}
.hide .term:not(.open) dd{filter:blur(6px);opacity:.5;user-select:none}
.hide .term:not(.open)::after{content:"Tippen zum Aufdecken";display:block;font-size:12px;color:var(--muted);margin-top:.35rem}
.empty{color:var(--muted);font-size:14px;padding:1rem 0}

/* Symbols */
.sgroup{margin-bottom:1.5rem}
.sgroup h2{font-size:15px;font-weight:600;margin-bottom:.5rem;color:var(--accent)}
.sym{display:grid;grid-template-columns:minmax(90px,170px) 1fr;gap:.2rem 1rem;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.65rem 1rem;margin-bottom:6px;align-items:baseline}
.sym .s{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:16px;font-weight:500;word-break:break-word;grid-row:span 3}
.sym .n{font-weight:600;font-size:14.5px}
.sym .m{font-size:14px;color:var(--muted)}
.sym .x{font-size:13px}
@media (max-width:520px){.sym{grid-template-columns:1fr}.sym .s{grid-row:auto}}

/* Quiz */
.pb{height:5px;background:var(--line);border-radius:3px;margin-bottom:1.1rem;overflow:hidden}
.pf{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem;gap:8px;flex-wrap:wrap}
.qn{font-size:13px;color:var(--muted)}
.qtag{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem}
.qt{font-size:16.5px;line-height:1.55;font-weight:500;margin-bottom:.4rem}
.hint{font-size:13px;color:var(--muted);margin-bottom:1rem}
pre.code{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:.85rem 1rem;font-size:13.5px;line-height:1.55;overflow-x:auto;margin:.25rem 0 1rem}
.os{display:flex;flex-direction:column;gap:8px;margin-bottom:1.1rem}
.op{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card);text-align:left;width:100%;font-size:15px;line-height:1.45}
.op:hover:not(:disabled){background:var(--soft)}
.op:disabled{cursor:default}
.ol{font-size:13px;font-weight:600;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:5px;color:var(--muted);flex-shrink:0;margin-top:1px}
.single .ol{border-radius:50%}
.op.sel{background:var(--accent-bg);border-color:var(--accent)}
.op.sel .ol{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.op.cor{background:var(--ok-bg);border-color:var(--ok)}
.op.cor .ol{border-color:var(--ok);background:var(--ok);color:var(--on-accent)}
.op.wrg{background:var(--bad-bg);border-color:var(--bad)}
.op.wrg .ol{border-color:var(--bad);background:var(--bad);color:var(--on-accent)}
.op.mis{background:var(--miss-bg);border-color:var(--miss)}
.op.mis .ol{border-color:var(--miss);color:var(--miss)}
.ac{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 22px;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--card);text-decoration:none}
.btn:hover:not(:disabled){background:var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pr{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pr:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.fb{font-size:14px;font-weight:600}
.fb.y{color:var(--ok)}.fb.n{color:var(--bad)}
.ex{background:var(--soft);border-radius:10px;padding:.9rem 1.1rem;margin-top:1rem;font-size:14.5px;line-height:1.6}
.ex b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:.75rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Result */
.res{text-align:center;padding:1.25rem 0}
.rs{font-size:56px;font-weight:700;color:var(--accent);letter-spacing:-.03em;line-height:1}
.rl{color:var(--muted);margin:.5rem 0 1.5rem}
.rb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.me{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem;text-align:left}
.mv{font-size:22px;font-weight:600}
.ml{font-size:12px;color:var(--muted)}
.res .ac{justify-content:center}
.wl{text-align:left;margin-top:2rem}
.wl h3{font-size:15px;margin-bottom:.6rem}
.wl li{font-size:14px;margin:0 0 .6rem 1.2rem;color:var(--muted)}
.wl li small{display:block;font-size:12px}

/* Schritt für Schritt */
.wrap.wide{max-width:1120px}
.callout{display:flex;gap:14px;align-items:center;text-decoration:none;background:var(--java-bg);border:1px solid var(--java);border-radius:14px;padding:1rem 1.2rem;margin-bottom:1.5rem}
.callout:hover{filter:brightness(1.03)}
.callout .ic{flex-shrink:0;width:42px;height:42px;border-radius:50%;background:var(--java);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:18px}
.callout b{display:block;font-size:16px}
.callout span.t{font-size:13.5px;color:var(--muted)}
.home-callout{margin:14px 0 0}
.grp{margin:1.75rem 0 .6rem}
.grp h2{font-size:17px;font-weight:600}
.grp p{font-size:13.5px;color:var(--muted)}
.inbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.85rem 1rem;margin-bottom:1rem}
.inbox h3{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.infields{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.infields label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);flex:1;min-width:120px}
.infields label.lg{flex-basis:100%}
.infields input{font:inherit;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.infields input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.ctrl{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg);padding:.6rem 0;border-bottom:1px solid var(--line);margin-bottom:.8rem}
.ctrl .btn{padding:8px 14px;font-size:14px}
.ctrl .cnt{font-size:13px;color:var(--muted);min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
.ctrl input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.expl{background:var(--accent-bg);border-left:4px solid var(--accent);border-radius:10px;padding:.85rem 1.1rem;font-size:15px;line-height:1.6;margin-bottom:1rem;white-space:pre-line;min-height:4.2em}
.expl.err{background:var(--bad-bg);border-color:var(--bad)}
.expl.stop{background:var(--miss-bg);border-color:var(--miss)}
.expl .ln{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:.2rem}
.pgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.panel h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 .35rem;font-weight:600}
.codebox{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:72vh;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;line-height:1.6;padding:.5rem 0;position:relative}
@media (max-width:820px){.codebox{max-height:52vh}}
.cl{display:flex;white-space:pre;padding-right:1rem;min-width:fit-content}
.cl .no{flex-shrink:0;width:2.6em;text-align:right;padding-right:.9em;color:var(--muted);opacity:.55;user-select:none}
.cl.cur{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
.cl.cur .no{color:var(--accent);opacity:1;font-weight:600}
.cl.done .no{opacity:.9}
.k{color:var(--java);font-weight:500}.st{color:var(--ok)}.cm{color:var(--muted);font-style:italic}.nm{color:var(--fs)}
.side{display:grid;gap:14px}
.vars{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.4rem .2rem;font-size:14px}
.frame{padding:.35rem .7rem}
.frame+.frame{border-top:1px dashed var(--line)}
.frame .fn{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:.2rem;font-family:"JetBrains Mono",ui-monospace,monospace}
.frame.act .fn{color:var(--accent)}
.frame:not(.act){opacity:.6}
.vr{display:grid;grid-template-columns:auto 1fr auto;gap:.6rem;align-items:baseline;padding:3px 6px;border-radius:6px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13.5px}
.vr .ty{color:var(--muted);font-size:11.5px}
.vr .vv{text-align:right;font-weight:500;word-break:break-all}
.vr.chg{background:var(--miss-bg)}
.vr.chg .vv{color:var(--miss)}
.vr .nov{color:var(--muted);font-weight:400}
.novars{color:var(--muted);font-size:13px;padding:.3rem .7rem}
.cons{background:#1c1917;color:#e7e5e4;border-radius:12px;padding:.75rem 1rem;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;min-height:5em;max-height:40vh;overflow:auto}
.cons .cin{color:#86A8F7;text-decoration:underline;text-underline-offset:3px}
.cons .new{background:rgba(245,149,99,.28);border-radius:3px}
.cons .ph{color:#78716c;font-style:italic}
.kbd{font-size:12px;color:var(--muted);margin-top:.6rem}

/* Code-Trainer */
.uprog{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;font-size:13.5px;color:var(--muted)}
.uprog .pb{flex:1;margin:0}
.num.ok{background:var(--ok-bg);color:var(--ok)}
.grp small.gd{font-size:13px;color:var(--muted);font-weight:500}
.solved{font-size:14px;font-weight:600;color:var(--ok);background:var(--ok-bg);padding:3px 10px;border-radius:999px;vertical-align:middle;letter-spacing:0}
.task{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:1rem 1.15rem;font-size:15.5px;line-height:1.65;white-space:pre-line;margin-bottom:1rem}
.edwrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.edwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
pre.tpl{margin:0;padding:.55rem 1rem;background:var(--soft);color:var(--muted);font-size:13.5px;line-height:1.6;white-space:pre;overflow-x:auto}
pre.tpl span{opacity:.75}
textarea.ed{display:block;width:100%;border:0;outline:0;resize:vertical;padding:.6rem 1rem;font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-ligatures:none;font-size:14px;line-height:1.6;background:var(--card);color:var(--ink);tab-size:2;min-height:7em;white-space:pre;overflow-x:auto}
textarea.ed.small{min-height:4em;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.inl{display:flex;align-items:center;gap:0;padding:.45rem 1rem;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;white-space:pre;overflow-x:auto}
.inl .ilp{flex-shrink:0}
.inl-in{flex:1;min-width:160px;font:inherit;font-variant-ligatures:none;padding:5px 8px;border:1.5px dashed var(--accent);border-radius:6px;background:var(--accent-bg);color:var(--ink);outline:0}
.inl-in:focus{border-style:solid}
.sm{font-size:13px}.mut{color:var(--muted)}
p.sm.mut{margin:.45rem 0 0}
.uebtn{margin:1rem 0}
.fbx{border-radius:12px;padding:.85rem 1.1rem;margin:0 0 .8rem;font-size:14.5px;line-height:1.55;border:1px solid}
.fbx>b{display:block;margin-bottom:.15rem}
.fbx ul{margin:.4rem 0 0 1.1rem}.fbx li{margin-bottom:.35rem}
.fbx .wh{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.fbx.bad{background:var(--bad-bg);border-color:var(--bad)}
.fbx.bad>b{color:var(--bad)}
.fbx.good{background:var(--ok-bg);border-color:var(--ok)}
.fbx.good>b{color:var(--ok);display:inline}
.fbx.good a{color:var(--ok);font-weight:600}
.fbx.warn{background:var(--miss-bg);border-color:var(--miss)}
.fbx.tip{background:var(--card);border-color:var(--line)}
.fbx pre.code{margin:.5rem 0 0}
.sold{margin-top:.6rem}.sold summary{cursor:pointer;font-weight:600;font-size:14px}
.tests{display:grid;gap:8px}
.codebox.static{max-height:none;margin-bottom:.5rem}
textarea.ed.mono{min-height:5em}
.tcase{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.55rem .9rem}
.tcase.bad{border-color:var(--bad)}
.tch{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tch .mut{font-weight:400}
.tic{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0}
.tcase.ok .tic{background:var(--ok)}.tcase.bad .tic{background:var(--bad)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:.5rem}
@media (max-width:600px){.cmp{grid-template-columns:1fr}}
.cmp small{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.cmp pre{background:var(--soft);border-radius:8px;padding:.5rem .7rem;font-size:13px;white-space:pre-wrap;word-break:break-word;margin-top:2px;min-height:2.2em}
.terr{font-size:13.5px;margin-top:.45rem}
h2.sh{font-size:16px;margin:1.5rem 0 .6rem}
h2.sh small{font-weight:400;color:var(--muted);font-size:13px}

/* Prüfungsmodus */
.prset{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem;display:grid;gap:1.1rem}
.prq h3{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-size:14.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.seg button small{font-size:11.5px;color:var(--muted);font-weight:400}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg button.on small{color:inherit;opacity:.85}
.chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 14px;font-size:14.5px}
.chks label{display:flex;gap:8px;align-items:center;cursor:pointer}
.chks input{accent-color:var(--accent);width:16px;height:16px}
.prhist{display:grid;gap:6px}
.prhist div{display:grid;grid-template-columns:1.4fr 1fr auto auto;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.5rem .9rem;font-size:14px;align-items:center}
.prbar{position:sticky;top:0;z-index:6;display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--bg);padding:.6rem 0;border-bottom:1px solid var(--line);margin-bottom:1rem}
.prpos{font-size:13px;color:var(--muted);font-weight:600}
.prpills{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.prpills button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-weight:600}
.prpills button.ans{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.prpills button.cur{outline:2px solid var(--accent);outline-offset:1px}
.prtime{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.prtime.low{color:var(--bad)}
.prnav a{cursor:pointer}
.prtopics{display:grid;gap:8px}
.prtop{display:grid;grid-template-columns:minmax(120px,220px) 1fr 52px;gap:12px;align-items:center;font-size:14px}
.prbarv{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.prbarv div{height:100%;border-radius:5px}
.prtop b{text-align:right}
.prlist{display:grid;gap:8px}
.prr{background:var(--card);border:1px solid var(--line);border-radius:12px}
.prr summary{display:flex;align-items:center;gap:10px;padding:.7rem 1rem;cursor:pointer;font-size:15px;list-style:none}
.prr summary::-webkit-details-marker{display:none}
.prr .prt{flex:1;font-weight:500}
.prr.ok .tic{background:var(--ok)}.prr.part .tic{background:var(--miss)}.prr.bad .tic{background:var(--bad)}
.prr.ok{border-color:var(--ok)}.prr.part{border-color:var(--miss)}
.prbody{padding:0 1rem 1rem;display:grid;gap:.5rem}
.prbody .task{margin:0;font-size:14px}
small.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin-top:.3rem}
.prbody pre.code{margin:0}

.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:.5rem}
@media (max-width:560px){.modes{grid-template-columns:minmax(0,1fr)}}
.mode{display:flex;flex-direction:column;gap:.3rem;text-decoration:none;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:14px;padding:1rem 1.1rem;transition:transform .12s,box-shadow .12s;cursor:pointer}
.mode:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.06)}
.mode .mstep{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.mode .mic{font-size:22px;line-height:1}
.mode b{font-size:17px;font-weight:600}
.mode .mt{font-size:13.5px;color:var(--muted);flex:1}
.mode .stat{align-self:flex-start;margin-top:.2rem}

details.themen{margin-top:1.25rem;background:var(--card);border:1px solid var(--line);border-radius:14px}
details.themen>summary{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;padding:.9rem 1.1rem;cursor:pointer;font-weight:600;font-size:16px;list-style:none}
details.themen>summary::-webkit-details-marker{display:none}
details.themen>summary::after{content:"▾";color:var(--accent);transition:transform .15s}
details.themen[open]>summary::after{transform:rotate(180deg)}
details.themen>summary .mut{flex:1;text-align:right;font-weight:400}
details.themen[open]{padding:0 1rem 1rem}
details.themen[open]>summary{margin:0 -1rem .5rem;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="daten-fs.js"></script>
<script src="daten-dr.js"></script>
<script src="daten-java.js"></script>
<script src="daten-java-minitests.js"></script>
<script src="daten-linux.js"></script>
<script src="daten-linux-pruefung.js"></script>
<script src="ablauf-java.js"></script>
<script src="mini-java.js"></script>
<script src="uebungen-java.js"></script>
<script>
var ORDER = ["fs","dr","java","linux"];
var L = "ABCDEFGH";
var app = document.getElementById("app");

/* ---------- Helpers ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function ov(h){return h.replace(/([^\u0305])\u0305/g,'<span class="ov">$1</span>')}
function fmt(s){return ov(esc(s).replace(/`([^`]+)`/g,"<code>$1</code>"))}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem("ilern_"+k));localStorage.setItem("ilern_"+k,JSON.stringify(v))}catch(e){return null}}
function setAccent(id){var r=document.documentElement.style;r.setProperty("--accent","var(--"+id+")");r.setProperty("--accent-bg","var(--"+id+"-bg)")}
function count(f,key){return FACH[f].themen.reduce(function(s,t){return s+t[key].length},0)}
function topicIdx(f,tid){var th=FACH[f].themen;for(var i=0;i<th.length;i++)if(th[i].id===tid)return i;return -1}
function crumbs(parts){
  var h='<nav class="top"><a class="brand" href="#/">Informatik lernen</a>';
  parts.forEach(function(p,i){h+='<span class="sep">›</span>'+(p[1]&&i<parts.length-1?'<a href="'+p[1]+'">'+esc(p[0])+'</a>':'<span class="cur">'+esc(p[0])+'</span>')});
  return h+'</nav>';
}

/* ---------- Home ---------- */
function home(){
  setAccent("fs");
  var h = '<nav class="top"><span class="brand">Informatik lernen</span><span class="sep">·</span><span>1. Semester</span></nav>';
  h += '<div class="hero"><h1>Begriffe, Zeichen und Quizfragen – nach deinen Unterlagen.</h1><p>Jedes Fach ist in Themen aufgeteilt, so wie die Foliensätze bzw. Skript-Kapitel. Zu jedem Thema gibt es die Begriffe zum Nachlesen und ein Quiz mit Erklärung, warum was richtig ist.</p></div><div class="subjects">';
  ORDER.forEach(function(f){
    var F=FACH[f];
    h += '<a class="subj" href="#/'+f+'" style="--c:var(--'+f+')"><h2>'+esc(F.name)+'<span>→</span></h2><p class="sub">'+esc(F.sub)+'</p><div class="stats">'+
      '<span class="stat">'+F.themen.length+' Themen</span><span class="stat">'+count(f,"terms")+' Begriffe</span><span class="stat">'+count(f,"quiz")+' Fragen</span>'+
      (F.zeichen?'<span class="stat">Zeichen & Symbole</span>':'')+'</div></a>';
  });
  var n = ORDER.reduce(function(s,f){return s+count(f,"quiz")},0), ba=store("best_all");
  h += '</div><div class="mix" style="--accent:var(--all);--accent-bg:var(--all-bg)"><p><b style="color:var(--ink)">Alles gemischt</b> – '+n+' Fragen aus allen Fächern'+(ba!=null?' · Bestes: '+ba+' %':'')+'</p><a class="pill pr" href="#/alle/quiz">Mix-Quiz starten</a></div>';
  h += '<p class="foot">Auch hier: <a href="biochemie_quiz.html">Biochemie-Quizzes</a></p>';
  app.innerHTML = h;
}

/* ---------- Subject ---------- */
function subject(f){
  setAccent(f);
  var F=FACH[f], bf=store("best_"+f);
  var h = crumbs([[F.name]]);
  h += '<div class="th"><span class="tag">Fach</span><h1>'+esc(F.name)+'</h1></div>';
  if(f==="java"&&window.UEBUNG&&window.ABLAUF){
    var nSolved=Object.keys(ueSolved()).length, hist=store("pr_hist")||[], last=hist.length?hist[hist.length-1].pct:null;
    var M=[["1 · Lesen","📖","Begriffe & Quiz","Alle Themen der VO mit Begriffen zum Nachlesen und Quizfragen.",F.themen.length+" Themen","javascript:void 0",' data-scroll="themen"'],
           ["2 · Verstehen","▶","Programme Schritt für Schritt","Beispielprogramme Zeile für Zeile durchklicken: Code, Variablen, Konsole und Erklärung.",ABLAUF.progs.length+" Programme","#/java/ablauf",""],
           ["3 · Üben","✎","Selbst programmieren","Code selbst schreiben, der Trainer prüft ihn sofort und erklärt Fehler.",UEBUNG.aufgaben.length+" Aufgaben"+(nSolved?" · "+nSolved+" gelöst":""),"#/java/ueben",""],
           ["4 · Testen","⏱","Prüfungsmodus","Zufällige Aufgaben mit Zeitlimit und ohne Tipps – am Ende Punkte und Note.",last!=null?"Zuletzt: "+last+" %":"5–15 Aufgaben","#/java/pruefung",""]];
    h += '<div class="modes">'+M.map(function(m){return '<a class="mode" href="'+m[5]+'"'+m[6]+'><span class="mstep">'+m[0]+'</span><span class="mic">'+m[1]+'</span><b>'+m[2]+'</b><span class="mt">'+m[3]+'</span><span class="stat">'+m[4]+'</span></a>'}).join("")+'</div>';
    h += '<details class="themen" id="themen"'+(window.JAVA_OPEN?' open':'')+'><summary><span>📖 Themen – Begriffe & Quiz</span><span class="mut sm">'+F.themen.length+' Themen · '+count(f,"terms")+' Begriffe · '+count(f,"quiz")+' Fragen</span></summary>';
  }
  if(F.hinweis) h += '<p class="note">'+fmt(F.hinweis)+'</p>';
  h += '<div class="row actions">'+(F.zeichen?'<a class="pill" href="#/'+f+'/zeichen">Zeichen & Symbole</a>':'')+
       '<a class="pill pr" href="#/'+f+'/quiz">Alle '+count(f,"quiz")+' Fragen mischen</a>'+(bf!=null?'<span class="stat">Bestes: '+bf+' %</span>':'')+'</div>';
  h += '<div class="topics">';
  F.themen.forEach(function(t,i){
    var b=store("best_"+f+"_"+t.id);
    h += '<a class="topic" href="#/'+f+'/'+t.id+'"><span class="num">'+(i+1)+'</span><div><h3>'+esc(t.name)+'</h3>'+
      '<p class="meta">'+t.terms.length+' Begriffe · '+t.quiz.length+' Fragen'+(t.kat?' · '+t.kat.length+'× '+(F.katName||'Fragenkatalog'):'')+' · '+esc(t.quelle)+'</p>'+
      (b!=null?'<p class="best">Bestes Quiz-Ergebnis: '+b+' %</p>':'')+'</div></a>';
  });
  h += '</div>';
  if(f==="java"&&window.UEBUNG&&window.ABLAUF) h += '</details>';
  app.innerHTML = h;
  var det=document.getElementById("themen");
  if(det&&det.tagName==="DETAILS") det.addEventListener("toggle",function(){window.JAVA_OPEN=det.open});
  var sc=app.querySelector('[data-scroll]'); if(sc) sc.onclick=function(){var d=document.getElementById(sc.dataset.scroll); if(d.tagName==="DETAILS"){d.open=true;window.JAVA_OPEN=true} d.scrollIntoView({behavior:'smooth'})};
}

/* ---------- Topic header ---------- */
function topicHead(f,i,view){
  var F=FACH[f], t=F.themen[i];
  var h = crumbs([[F.name,"#/"+f],[t.name]]);
  h += '<div class="th"><span class="tag">Thema '+(i+1)+' von '+F.themen.length+'</span><h1>'+esc(t.name)+'</h1><p class="src">Quelle: '+esc(t.quelle)+'</p></div>';
  h += '<nav class="tabs"><a'+(view==="b"?' class="on"':'')+' href="#/'+f+'/'+t.id+'">Begriffe ('+t.terms.length+')</a><a'+(view==="q"?' class="on"':'')+' href="#/'+f+'/'+t.id+'/quiz">Quiz ('+t.quiz.length+')</a></nav>';
  return h;
}
function prevNext(f,i,suffix){
  var th=FACH[f].themen, h='<div class="pn">';
  if(i>0) h+='<a href="#/'+f+'/'+th[i-1].id+suffix+'"><small>← vorheriges Thema</small>'+esc(th[i-1].name)+'</a>';
  if(i<th.length-1) h+='<a class="nx" href="#/'+f+'/'+th[i+1].id+suffix+'"><small>nächstes Thema →</small>'+esc(th[i+1].name)+'</a>';
  return h+'</div>';
}

/* ---------- Glossary ---------- */
var hideDefs = false;
function glossary(f,i){
  setAccent(f);
  var t=FACH[f].themen[i];
  var h = topicHead(f,i,"b");
  if(t.kat) h += '<details class="kat"><summary>'+(FACH[f].katName?esc(FACH[f].katName)+': '+t.kat.length+' Frage'+(t.kat.length>1?'n':''):'Fragenkatalog: '+t.kat.length+' Prüfungspunkt'+(t.kat.length>1?'e':''))+' zu diesem Thema</summary><ul>'+t.kat.map(function(k){return '<li>'+esc(k)+'</li>'}).join("")+'</ul></details>';
  h += '<div class="gtools"><input class="search" id="s" type="search" placeholder="Begriff suchen …" autocomplete="off">'+
       '<label class="toggle"><input type="checkbox" id="hd"'+(hideDefs?' checked':'')+'> Erklärungen verdecken</label></div>'+
       '<dl class="terms'+(hideDefs?' hide':'')+'" id="tl"></dl>';
  h += '<div class="ac" style="margin-top:1.5rem"><a class="btn pr" href="#/'+f+'/'+t.id+'/quiz">Quiz zu diesem Thema starten</a></div>';
  h += prevNext(f,i,"");
  app.innerHTML = h;
  var tl=document.getElementById("tl"), s=document.getElementById("s");
  function draw(){
    var q=s.value.trim().toLowerCase();
    var list=t.terms.filter(function(x){return !q||(x.join(" ")).toLowerCase().indexOf(q)>=0});
    tl.innerHTML = list.length ? list.map(function(x){
      return '<div class="term"><dt>'+ov(esc(x[0]))+'</dt><dd>'+fmt(x[1])+(x[2]?'<span class="ex2">Beispiel: '+fmt(x[2])+'</span>':'')+(x[3]?'<pre class="code">'+esc(x[3])+'</pre>':'')+'</dd></div>';
    }).join("") : '<p class="empty">Kein Begriff gefunden.</p>';
  }
  s.oninput=draw;
  document.getElementById("hd").onchange=function(){hideDefs=this.checked;tl.classList.toggle("hide",hideDefs);tl.querySelectorAll(".open").forEach(function(e){e.classList.remove("open")})};
  tl.onclick=function(e){var c=e.target.closest(".term");if(c&&hideDefs)c.classList.toggle("open")};
  draw();
}

/* ---------- Symbols ---------- */
function symbols(f){
  setAccent(f);
  var F=FACH[f];
  var h = crumbs([[F.name,"#/"+f],["Zeichen & Symbole"]]);
  h += '<div class="th"><span class="tag">Nachschlagen</span><h1>Zeichen & Symbole</h1><p class="src">'+esc(F.name)+' – Schreibweisen aus den Unterlagen</p></div>';
  h += '<div class="gtools"><input class="search" id="s" type="search" placeholder="Zeichen oder Bedeutung suchen …" autocomplete="off"></div><div id="sl"></div>';
  app.innerHTML = h;
  var sl=document.getElementById("sl"), s=document.getElementById("s");
  function draw(){
    var q=s.value.trim().toLowerCase(), out="";
    F.zeichen.forEach(function(g){
      var rows=g.rows.filter(function(r){return !q||(r.join(" ")+" "+g.g).toLowerCase().indexOf(q)>=0});
      if(!rows.length) return;
      out+='<section class="sgroup"><h2>'+esc(g.g)+'</h2>'+rows.map(function(r){
        return '<div class="sym"><div class="s">'+ov(esc(r[0]))+'</div><div class="n">'+ov(esc(r[1]))+'</div>'+
          (r[2]?'<div class="m">'+ov(esc(r[2]))+'</div>':'')+(r[3]?'<div class="x">Beispiel: <code>'+ov(esc(r[3]))+'</code></div>':'')+'</div>';
      }).join("")+'</section>';
    });
    sl.innerHTML = out || '<p class="empty">Nichts gefunden.</p>';
  }
  s.oninput=draw; draw();
}

/* ---------- Quiz ---------- */
var S;
function buildPool(scope){
  var pool=[];
  function add(f,t){t.quiz.forEach(function(q){pool.push({q:q,f:f,t:t})})}
  if(scope.all) ORDER.forEach(function(f){FACH[f].themen.forEach(function(t){add(f,t)})});
  else if(scope.i==null) FACH[scope.f].themen.forEach(function(t){add(scope.f,t)});
  else add(scope.f,FACH[scope.f].themen[scope.i]);
  return pool;
}
function quiz(scope, onlyWrong){
  setAccent(scope.all?"all":scope.f);
  var pool = onlyWrong || buildPool(scope);
  pool = shuffle(pool).map(function(p){return {q:p.q,f:p.f,t:p.t,idx:shuffle(p.q.o.map(function(_,i){return i}))}});
  S={scope:scope,list:pool,i:0,sel:[],done:false,right:0,wrong:[],retry:!!onlyWrong};
  drawQ();
}
function quizHead(){
  var sc=S.scope;
  if(sc.all) return crumbs([["Alles gemischt"]])+'<div class="th"><span class="tag">Quiz</span><h1>Alles gemischt</h1></div>';
  var F=FACH[sc.f];
  if(sc.i==null) return crumbs([[F.name,"#/"+sc.f],["Fach-Quiz"]])+'<div class="th"><span class="tag">Quiz · alle Themen</span><h1>'+esc(F.name)+'</h1></div>';
  return topicHead(sc.f,sc.i,"q");
}
function bestKey(){var sc=S.scope;return sc.all?"best_all":sc.i==null?"best_"+sc.f:"best_"+sc.f+"_"+FACH[sc.f].themen[sc.i].id}
function drawQ(){
  var it=S.list[S.i], q=it.q, multi=q.c.length>1, sc=S.scope;
  var h=quizHead();
  h+='<div class="pb"><div class="pf" style="width:'+(S.i/S.list.length*100)+'%"></div></div>';
  h+='<div class="qh"><span class="qn">Frage '+(S.i+1)+' von '+S.list.length+'</span>';
  if(sc.all||sc.i==null) h+='<span class="qtag" style="color:var(--'+it.f+');background:var(--'+it.f+'-bg)">'+(sc.all?esc(FACH[it.f].kurz)+' · ':'')+esc(it.t.name)+'</span>';
  h+='</div><div class="qcard"><p class="qt">'+fmt(q.q)+'</p>';
  h+='<p class="hint">'+(multi?'Mehrere Antworten richtig – wähle alle passenden.':'Eine Antwort ist richtig.')+'</p>';
  if(q.code) h+='<pre class="code">'+esc(q.code)+'</pre>';
  h+='<div class="os'+(multi?'':' single')+'">';
  it.idx.forEach(function(oi,pos){
    var cls="op";
    if(S.done){var isC=q.c.indexOf(oi)>=0, isS=S.sel.indexOf(oi)>=0; cls+=isC&&isS?" cor":isC?" mis":isS?" wrg":"";}
    else if(S.sel.indexOf(oi)>=0) cls+=" sel";
    h+='<button class="'+cls+'" data-o="'+oi+'"'+(S.done?' disabled':'')+'><span class="ol">'+L[pos]+'</span><span>'+fmt(q.o[oi])+'</span></button>';
  });
  h+='</div><div class="ac">';
  if(!S.done) h+='<button class="btn pr" id="chk"'+(S.sel.length?'':' disabled')+'>Prüfen</button>';
  else h+='<button class="btn pr" id="nx">'+(S.i<S.list.length-1?'Weiter →':'Ergebnis ansehen')+'</button><span class="fb '+(S.lastOk?'y':'n')+'">'+(S.lastOk?'✓ Richtig!':'✗ Nicht ganz')+'</span>';
  h+='</div>';
  if(S.done){
    h+='<div class="ex"><b>Erklärung</b>'+fmt(q.e)+'</div>';
    if(!S.lastOk) h+='<div class="legend"><span><i style="background:var(--ok)"></i>richtig gewählt</span><span><i style="background:var(--miss)"></i>übersehen</span><span><i style="background:var(--bad)"></i>falsch gewählt</span></div>';
  }
  h+='</div>';
  app.innerHTML=h;
  app.querySelectorAll(".op").forEach(function(b){b.onclick=function(){
    var o=+b.dataset.o, k=S.sel.indexOf(o);
    if(multi){ if(k>=0)S.sel.splice(k,1); else S.sel.push(o); } else S.sel=[o];
    drawQ();
  }});

/* ---------- Prüfungsmodus ---------- */
var PR={timer:null};
function prStop(){if(PR.timer){clearInterval(PR.timer);PR.timer=null}}
function prState(v){ if(v===undefined) return store("pr_state"); store("pr_state",v); }
function prFind(id){var A=UEBUNG.aufgaben;for(var i=0;i<A.length;i++)if(A[i].id===id)return A[i];return null}
function prGrade(x,code){
  // liefert {pts, max:10, info}
  if(x.typ==="vorhersage"){
    var soll=MJ.run(MJ.compile(x.code),[],{}).stdout, ok=!!code.trim()&&ueNorm(code)===ueNorm(soll);
    return {pts:ok?10:0,ok:ok,soll:soll,vor:true};
  }
  if(!code.trim()||code.trim()===(x.start||"").trim()) return {pts:0,empty:true,tests:[]};
  var a0=UEBUNG.assemble(x,code,x.tests[0]), c0=MJ.compile(a0.src);
  if(c0.errors.length) return {pts:0,cerr:c0.errors,a:a0,tests:[]};
  var tests=x.tests.map(function(t,i){
    var a=UEBUNG.assemble(x,code,t), c=MJ.compile(a.src), r=c.errors.length?{error:c.errors[0],stdout:""}:MJ.run(c,t.in||[],{maxSteps:200000}), exp=ueExpected(x,t,i);
    return {t:t,ok:!r.error&&ueNorm(r.stdout)===ueNorm(exp),exp:exp,got:r.stdout,error:r.error};
  });
  var plain=ueStrip(code), req=[];
  (x.muss||[]).forEach(function(m){ if(!m[0].test(plain)) req.push(m[1]) });
  (x.verboten||[]).forEach(function(m){ if(m[0].test(plain)) req.push(m[1]) });
  var n=tests.filter(function(t){return t.ok}).length, pts=10*n/tests.length;
  if(req.length) pts=pts/2;
  pts=Math.round(pts*2)/2;
  return {pts:pts,ok:n===tests.length&&!req.length,tests:tests,req:req,warn:c0.warnings,a:a0};
}
function prNote(pct){return pct>=87.5?[1,"Sehr gut"]:pct>=75?[2,"Gut"]:pct>=62.5?[3,"Befriedigend"]:pct>=50?[4,"Genügend"]:[5,"Nicht genügend"]}

  h+='<div class="prset"><div class="prq"><h3>Wie viele Aufgaben?</h3><div class="seg" id="prn"><button data-v="5">5</button><button data-v="10" class="on">10</button><button data-v="15">15</button></div></div>';

  function groups(){return [].slice.call(app.querySelectorAll(".chks input:checked")).map(function(c){return c.value})}
  function info(){var gs=groups(), pool=UEBUNG.aufgaben.filter(function(x){return gs.indexOf(x.gruppe)>=0}).length; document.getElementById("prinfo").textContent=gs.length?(Math.min(n,pool)+" Aufgaben"+(per?" · "+Math.min(n,pool)*per+" Minuten":" · ohne Zeitlimit")+" · "+Math.min(n,pool)*10+" Punkte"):"Wähle mindestens ein Thema."; document.getElementById("prgo").disabled=!gs.length;}
  seg("prn",function(v){n=v}); seg("prt",function(v){per=v});
  app.querySelectorAll(".chks input").forEach(function(c){c.onchange=info});
  info();

  document.getElementById("prgo").onclick=function(){

    gs.forEach(function(g){byG[g]=shuffle(A.filter(function(x){return x.gruppe===g}))});
    var pick=[], order=shuffle(gs), k=0;
    while(pick.length<n){ var any=false; order.forEach(function(g){ if(pick.length<n&&byG[g].length){pick.push(byG[g].pop());any=true} }); if(!any) break; k++; }
    pick.sort(function(a,b){return A.indexOf(a)-A.indexOf(b)});

    location.hash="#/java/pruefung/laeuft";
  };
}

      h+='<h2 class="sh">Deine Antwort – was steht in der Konsole?</h2><div class="edwrap"><textarea id="ued" class="ed small mono" rows="4" spellcheck="false" autocapitalize="off">'+esc(code)+'</textarea></div>';
    } else {
      var set0=x.tests[0].set;

      if(x.vor) h+='<pre class="tpl">'+UEBUNG.fill(x.vor,set0).split("\n").map(hlJava).join("\n")+'</pre>';
      if(x.inline) h+='<div class="inl"><span class="ilp">'+hlJava(x.inline[0])+'</span><input id="ued" class="inl-in" value="'+esc(code)+'" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="dein Ausdruck"><span class="ilp">'+hlJava(x.inline[1])+'</span></div>';

      h+='</div><div class="row uebtn"><button class="btn" id="prcomp">Kompilieren</button><span class="sm mut">prüft nur, ob der Code übersetzbar ist – nicht, ob er richtig rechnet</span></div><div id="prc"></div>';
    }
    h+='<div class="pn prnav">'+(i>0?'<a href="javascript:void 0" id="prprev"><small>← vorherige</small>Aufgabe '+i+'</a>':'<span></span>')+(i<X.length-1?'<a href="javascript:void 0" class="nx" id="prnext"><small>nächste →</small>Aufgabe '+(i+2)+'</a>':'<a href="javascript:void 0" class="nx" id="prnext2"><small>fertig?</small>Prüfung abgeben</a>')+'</div>';
    app.innerHTML=h; window.scrollTo(0,0);
    var ed=document.getElementById("ued");
    ueAutoRows(ed);
    ed.addEventListener("input",function(){st.codes[i]=ed.value;save();ueAutoRows(ed);var pb=app.querySelector('.prpills [data-k="'+i+'"]');if(pb)pb.classList.toggle("ans",!!answered(i))});
    ueEditorKeys(ed,function(){var c=document.getElementById("prcomp");if(c)c.click()});
    app.querySelector(".prpills").onclick=function(e){var b=e.target.closest("button");if(b){st.cur=+b.dataset.k;save();draw()}};
    var pv=document.getElementById("prprev"); if(pv) pv.onclick=function(){st.cur--;save();draw()};
    var nx=document.getElementById("prnext"); if(nx) nx.onclick=function(){st.cur++;save();draw()};
    var nx2=document.getElementById("prnext2"); if(nx2) nx2.onclick=submitAsk;
    document.getElementById("prsub").onclick=submitAsk;
    var cb=document.getElementById("prcomp");
    if(cb) cb.onclick=function(){
      var a=UEBUNG.assemble(x,ed.value,x.tests[0]), c=MJ.compile(a.src), out=document.getElementById("prc");
      out.innerHTML=c.errors.length?ueErrorsHTML(c.errors,a,ed.value,!!x.inline):'<div class="fbx good"><b style="display:inline">✓ Kompiliert ohne Fehler.</b> Ob das Ergebnis stimmt, siehst du nach der Abgabe.</div>'+ueWarnHTML(c.warnings,a,ed.value,!!x.inline);
    };
  }
  function submitAsk(){
    var open=X.filter(function(_,k){return !answered(k)}).length;
    var el=document.getElementById("prconfirm");
    if(el){el.remove();}
    app.insertAdjacentHTML("afterbegin",'<div class="fbx warn" id="prconfirm"><b>Wirklich abgeben?</b> '+(open?open+' Aufgabe'+(open>1?'n sind':' ist')+' noch unbearbeitet. ':'')+'Danach kannst du nichts mehr ändern.<div class="row" style="margin-top:.6rem"><button class="btn pr" id="pryes">Ja, abgeben</button><button class="btn" id="prno">Weiterarbeiten</button></div></div>');
    window.scrollTo(0,0);
    document.getElementById("pryes").onclick=submit;
    document.getElementById("prno").onclick=function(){document.getElementById("prconfirm").remove()};
  }
  function submit(){
    prStop();
    var res=X.map(function(x,k){return prGrade(x,st.codes[k]||"")});
    var pts=res.reduce(function(s,r){return s+r.pts},0), max=X.length*10, pct=Math.round(pts/max*1000)/10;
    st.done=true; st.pts=pts; st.pct=pct; st.finished=Date.now(); save();
    var hist=store("pr_hist")||[]; hist.push({t:Date.now(),n:X.length,pct:pct}); store("pr_hist",hist.slice(-30));
    var sv=ueSolved(); res.forEach(function(r,k){ if(r.ok) sv[X[k].id]=Date.now() }); store("ue_solved",sv);
    location.hash="#/java/pruefung/ergebnis";
  }
  draw();
  if(st.end){
    PR.timer=setInterval(function(){
      var left=(st.end-Date.now())/1000, el=document.getElementById("prtime");
      if(el){ el.textContent="⏱ "+prFmtTime(left); el.classList.toggle("low",left<120); }
      if(left<=0){ prStop(); submit(); }
    },500);
  }
}
function prResult(){
  setAccent("java"); prStop();
  var st=prState();
  if(!st||!st.done){ location.hash="#/java/pruefung"; return; }
  var X=st.ids.map(prFind), res=X.map(function(x,k){return prGrade(x,st.codes[k]||"")});
  var pts=res.reduce(function(s,r){return s+r.pts},0), max=X.length*10, pct=Math.round(pts/max*1000)/10, note=prNote(pct);
  var dur=st.finished&&st.start?Math.round((st.finished-st.start)/60000):null;
  var h=crumbs([[FACH.java.name,"#/java"],["Prüfungsmodus","#/java/pruefung"],["Ergebnis"]]);
  h+='<div class="th"><span class="tag">Java · Prüfungsmodus</span><h1>Ergebnis</h1></div>';
  h+='<div class="res"><div class="rs">'+pct+' %</div><p class="rl">'+(pts%1?pts.toFixed(1):pts)+' von '+max+' Punkten'+(dur!=null?' · '+dur+' Minuten':'')+'</p>';
  h+='<div class="rb"><div class="me"><div class="mv">'+note[0]+'</div><div class="ml">Note (Richtwert): '+note[1]+'</div></div><div class="me"><div class="mv">'+res.filter(function(r){return r.ok}).length+'</div><div class="ml">ganz richtig</div></div><div class="me"><div class="mv">'+res.filter(function(r){return !r.ok&&r.pts>0}).length+'</div><div class="ml">teilweise</div></div></div>';
  h+='<p class="sm mut">Notengrenzen hier: ab 87.5 % Sehr gut, 75 % Gut, 62.5 % Befriedigend, 50 % Genügend. Eure LV kann andere Grenzen haben.</p></div>';
  // nach Themen
  var byG={}; X.forEach(function(x,k){ (byG[x.gruppe]=byG[x.gruppe]||{p:0,m:0}); byG[x.gruppe].p+=res[k].pts; byG[x.gruppe].m+=10; });
  h+='<h2 class="sh">Nach Themen</h2><div class="prtopics">';
  UEBUNG.gruppen.forEach(function(g){ var b=byG[g[0]]; if(!b) return; var q=Math.round(b.p/b.m*100);
    h+='<div class="prtop"><span>'+esc(g[1])+'</span><div class="prbarv"><div style="width:'+q+'%;background:'+(q>=75?'var(--ok)':q>=50?'var(--miss)':'var(--bad)')+'"></div></div><b>'+q+' %</b></div>'; });
  h+='</div>';
  var weak=UEBUNG.gruppen.filter(function(g){var b=byG[g[0]];return b&&b.p/b.m<0.6});
  if(weak.length) h+='<div class="fbx tip"><b>Das solltest du nochmal üben</b><p>'+weak.map(function(g){return esc(g[1])}).join(", ")+' – im <a href="#/java/ueben">Code-Trainer</a> gibt es dazu weitere Aufgaben mit Tipps.</p></div>';
  // Aufgaben im Detail
  h+='<h2 class="sh">Die Aufgaben im Detail</h2><div class="prlist">';
  X.forEach(function(x,k){
    var r=res[k], code=st.codes[k]||"", cls=r.ok?"ok":r.pts>0?"part":"bad";
    h+='<details class="prr '+cls+'"><summary><span class="tic">'+(r.ok?'✓':r.pts>0?'◐':'✗')+'</span><span class="prt">'+(k+1)+'. '+esc(x.titel)+'</span><b>'+r.pts+' / 10</b></summary><div class="prbody">';
    h+='<div class="task sm">'+fmtB(x.aufgabe)+'</div>';
    if(r.vor){
      h+='<div class="codebox static">'+x.code.split("\n").map(function(l,j){return '<div class="cl"><span class="no">'+(j+1)+'</span><span>'+(hlJava(l)||" ")+'</span></div>'}).join("")+'</div>';
      h+='<div class="cmp"><div><small>deine Antwort</small><pre>'+(esc(code)||'<span class="mut">(leer)</span>')+'</pre></div><div><small>richtige Ausgabe</small><pre>'+esc(r.soll)+'</pre></div></div>';
      h+='<div class="fbx tip" style="margin-top:.6rem"><b>Erklärung</b><p>'+fmtB(x.erkl)+'</p></div>';
    } else {
      h+='<small class="lbl">dein Code</small><pre class="code">'+(r.empty?'<span class="mut">(nicht bearbeitet)</span>':code.split("\n").map(hlJava).join("\n"))+'</pre>';
      if(r.cerr) h+=ueErrorsHTML(r.cerr,r.a,code,!!x.inline);
      if(r.req&&r.req.length) h+='<div class="fbx warn"><b>Anforderung nicht erfüllt (Punkte halbiert)</b><ul>'+r.req.map(function(m){return '<li>'+fmtB(m)+'</li>'}).join("")+'</ul></div>';
      if(r.tests&&r.tests.length){
        h+='<div class="tests">'+r.tests.map(function(t,i){
          var o='<div class="tcase '+(t.ok?'ok':'bad')+'"><div class="tch"><span class="tic">'+(t.ok?'✓':'✗')+'</span>Test '+(i+1)+' <span class="mut">· '+esc(ueLabel(t.t))+'</span></div>';
          if(!t.ok){ o+='<div class="cmp"><div><small>erwartet</small><pre>'+(esc(t.exp)||'<span class="mut">(keine Ausgabe)</span>')+'</pre></div><div><small>dein Programm</small><pre>'+(esc(t.got)||'<span class="mut">(keine Ausgabe)</span>')+'</pre></div></div>'; if(t.error) o+='<p class="terr">💥 '+fmtB(t.error.msg)+'</p>'; }
          return o+'</div>';
        }).join("")+'</div>';
      }
      h+='<small class="lbl">Musterlösung</small><pre class="code">'+x.loesung.split("\n").map(hlJava).join("\n")+'</pre>';
    }
    h+='<p class="sm"><a href="#/java/ueben/'+x.id+'">Diese Aufgabe im Trainer üben →</a></p></div></details>';
  });
  h+='</div><div class="row" style="margin-top:1.5rem"><button class="btn pr" id="prnew">Neue Prüfung</button><a class="btn" href="#/java/ueben">Zum Code-Trainer</a></div>';
  app.innerHTML=h;
  document.getElementById("prnew").onclick=function(){prState(null);location.hash="#/java/pruefung"};
}

/* ---------- Router ---------- */
function route(){
  var p=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  var f=p[0];
  abStop(); if(typeof prStop==="function") prStop(); app.className="wrap"+(f==="java"&&((p[1]==="ablauf"||p[1]==="ueben")&&p[2]||p[1]==="pruefung"&&p[2])?" wide":"");
  if(f==="alle"&&p[1]==="quiz") quiz({all:true});
  else if(f==="java"&&p[1]==="ablauf"&&window.ABLAUF){ if(p[2]) abShow(p[2]); else abList(); }
  else if(f==="java"&&p[1]==="ueben"&&window.UEBUNG&&window.MJ){ if(p[2]) ueShow(p[2]); else ueList(); }
  else if(f==="java"&&p[1]==="pruefung"&&window.UEBUNG&&window.MJ){ if(p[2]==="laeuft") prRun(); else if(p[2]==="ergebnis") prResult(); else prSetup(); }
  else if(FACH[f]){
    if(!p[1]) subject(f);
    else if(p[1]==="zeichen"&&FACH[f].zeichen) symbols(f);
    else if(p[1]==="quiz") quiz({f:f});
    else { var i=topicIdx(f,p[1]); if(i<0) subject(f); else if(p[2]==="quiz") quiz({f:f,i:i}); else glossary(f,i); }
  }
  else home();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>

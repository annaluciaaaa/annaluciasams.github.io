<div class="pad">${m}</div>
<div class="pad" style="margin-top:12px"><div style="padding:12px 14px;border-radius:14px;background:${bg};display:flex;gap:10px;align-items:flex-start"><span style="flex-shrink:0;margin-top:1px">${ic(PIN,20,2)}</span><span style="font-size:14px;line-height:1.45">${st}</span></div></div>
<div class="pad" style="margin-top:12px;display:flex;gap:10px"><button class="btn" data-a="next" style="flex-grow:1;background:#1D5B42;color:#fff">${ic('M7 4l12 8-12 8z',18,2)}Fahrt simulieren</button>${kids()?`<button class="btn card" data-a="badges" style="padding:0 16px;font-weight:600">Sammelheft ${n}/6</button>`:''}</div>
<div class="pad" style="margin-top:12px"><button class="card" data-a="lex" style="width:100%;height:56px;padding:0 14px;display:flex;align-items:center;gap:12px;text-align:left"><span style="display:flex;gap:4px">${[I.newt,I.butterfly,I.bird,I.bee].map(d=>`<span style="width:30px;height:30px;border-radius:15px;background:#E3EEE8;color:#1D5B42;display:flex;align-items:center;justify-content:center">${ic(d,18,1.8)}</span>`).join('')}</span><span style="flex-grow:1;font-size:15px;font-weight:700">Tierlexikon</span>${ic(NEXT,20,2)}</button></div>
<div class="pad" style="margin-top:12px"><div class="card" style="padding:12px 14px;display:flex;align-items:center;gap:12px"><div style="flex-grow:1"><div class="lbl" style="color:#1D5B42">ENTLANG DER GANZEN STRECKE</div><div style="font-size:13px;line-height:1.4;margin-top:2px">Die Matterhorn Gotthard Bahn bekämpft invasive Pflanzen wie den Schmetterlingsflieder.</div></div><button data-a="toast" style="height:44px;padding:0 12px;border:0;border-radius:12px;background:#E3EEE8;color:#1D5B42;font-size:13px;font-weight:700;white-space:nowrap">Fund melden</button></div>
${S.toast?`<div style="margin-top:8px;padding:10px 14px;border-radius:12px;background:#16201B;color:#fff;font-size:13px;line-height:1.4">Im fertigen Produkt öffnet sich hier die Meldung an InfoFlora – nur von Wanderwegen aus, nie im Gleisbereich.</div>`:''}</div></div>`}

function station(){
 const c=D.find(s=>s.id===S.sel)||D[0];
 const an=c.animals.map(id=>`<button class="card" data-an="${id}" style="padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:8px"><span class="ic" style="width:52px;height:52px;border-radius:26px">${ic(A[id].d,30)}</span><span style="font-size:13px;font-weight:700;text-align:center;line-height:1.25">${A[id].name}</span></button>`).join('');
 return `<div style="background:#1D5B42;color:#fff;padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px">${back(true)}<span style="font-size:13px;font-weight:600;color:#DCEBE3">${c.name} · ${c.habitat}</span><h2 class="h" style="margin:0;font-size:30px;line-height:1.1">${c.theme}</h2></div>
<div style="padding:20px;display:flex;flex-direction:column;gap:16px"><p style="margin:0;font-size:16px;line-height:1.55">${kids()?c.kids:c.adult}</p>
${c.animals.length?`<div style="display:flex;flex-direction:column;gap:10px"><span class="lbl" style="color:#4F5B55">${c.animalLabel}</span><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">${an}</div></div>`:''}
<div style="padding:14px 16px;border-radius:16px;background:#FDF0E8"><div class="lbl" style="color:#8A3A0E">DAS TUT DIE MATTERHORN GOTTHARD BAHN HIER</div><div style="font-size:15px;line-height:1.5;margin-top:6px">${c.mgi}</div></div>
<div class="card" style="padding:14px 16px;display:flex;gap:12px"><span style="color:#1D5B42;flex-shrink:0;margin-top:2px">${ic(BULB,22,2)}</span><div><div class="lbl" style="color:#1D5B42">WUSSTEST DU?</div><div style="font-size:15px;line-height:1.5;margin-top:4px">${c.fact}</div></div></div>
${kids()?`<div class="card" style="padding:14px 16px"><div class="lbl" style="color:#1D5B42">DEINE AUFGABE</div><div style="font-size:15px;line-height:1.5;margin-top:6px">${c.task}</div></div><div style="padding:14px 16px;border-radius:16px;background:#1D5B42;color:#fff;display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:22px;background:#fff;color:#1D5B42;display:flex;align-items:center;justify-content:center;flex-shrink:0">${ic(STAR,22,2)}</span><span style="font-size:15px;font-weight:600">Abzeichen gesammelt: ${c.badge}</span></div>`:''}
<p style="margin:4px 0 0;font-size:12px;line-height:1.5;color:#4F5B55">Quelle: Biodiversitätsbericht 2024 der Matterhorn Gotthard Infrastruktur AG und Handbuch Biodiversität.</p></div>`}

function lexicon(){
 return `<div style="padding:16px 20px 28px;display:flex;flex-direction:column;gap:12px">${back(false)}<h2 class="h" style="margin:0;font-size:30px">Tierlexikon</h2><p style="margin:0;font-size:15px;line-height:1.5;color:#4F5B55">Diese Tiere und Tiergruppen nennt der Biodiversitätsbericht der Bahn. Tippe für den Steckbrief.</p>
${Object.keys(A).map(id=>`<button class="card" data-an="${id}" style="min-height:72px;padding:10px 14px;display:flex;align-items:center;gap:14px;text-align:left"><span class="ic">${ic(A[id].d,28)}</span><span style="flex-grow:1"><span style="display:block;font-size:16px;font-weight:700">${A[id].name}</span><span style="display:block;font-size:13px;color:#4F5B55">${whereOf(id)}</span></span>${ic(NEXT,18,2)}</button>`).join('')}</div>`}

function badges(){
 return `<div style="padding:16px 20px 28px;display:flex;flex-direction:column;gap:16px">${back(false)}<h2 class="h" style="margin:0;font-size:30px">Dein Sammelheft</h2><p style="margin:0;font-size:15px;line-height:1.5;color:#4F5B55">Tippe unterwegs auf die Stationen. Für jede bekommst du ein Abzeichen.</p><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
${D.map(s=>{const g=!!S.earned[s.id];return `<div style="padding:16px 12px;border-radius:16px;background:${g?'#fff':'#ECEFEC'};border:1px solid #DDE4DF;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center"><span style="width:56px;height:56px;border-radius:28px;background:${g?'#1D5B42':'#D5DBD7'};color:${g?'#fff':'#6B756F'};display:flex;align-items:center;justify-content:center">${ic(STAR,26,2)}</span><span style="font-size:14px;font-weight:700;color:${g?'#16201B':'#4F5B55'}">${s.badge}</span><span style="font-size:12px;color:#4F5B55">${s.name}</span></div>`}).join('')}</div></div>`}

function sheet(){
 if(!S.animal)return '';const a=A[S.animal];
 return `<div class="sheetbg" data-a="bgclose"><div class="sheet" role="dialog" aria-label="Steckbrief ${a.name}"><div style="display:flex;align-items:center;justify-content:space-between"><span class="lbl" style="color:#4F5B55">STECKBRIEF</span><button data-a="close" aria-label="Steckbrief schließen" style="width:44px;height:44px;border-radius:22px;border:1px solid #DDE4DF;background:#fff;display:flex;align-items:center;justify-content:center">${ic('M6 6l12 12 M18 6L6 18',18,2)}</button></div>
<div style="display:flex;align-items:center;gap:16px"><span class="ic" style="width:84px;height:84px;border-radius:42px">${ic(a.d,48,1.4)}</span><div><div class="h" style="font-size:26px">${a.name}</div><div style="font-size:14px;color:#4F5B55">${a.group}</div></div></div>
<p style="margin:0;font-size:16px;line-height:1.55">${kids()?a.kids:a.adult}</p>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"><div style="padding:12px;border-radius:14px;background:#F4F6F3"><div style="font-size:11px;font-weight:700;color:#4F5B55">QUELLE</div><div style="font-size:14px;font-weight:600;margin-top:4px">${a.source}</div></div><div style="padding:12px;border-radius:14px;background:#F4F6F3"><div style="font-size:11px;font-weight:700;color:#4F5B55">LEBENSRAUM LAUT BERICHT</div><div style="font-size:14px;font-weight:600;margin-top:4px">${a.home}</div></div></div>
<div style="padding:12px 14px;border-radius:14px;background:#FDF0E8"><div style="font-size:11px;font-weight:700;color:#8A3A0E">SO HILFT DIE BAHN</div><div style="font-size:14px;line-height:1.5;margin-top:4px">${a.help}</div></div>
<span style="font-size:13px;color:#4F5B55">In der App bei: ${whereOf(S.animal)}</span></div></div>`}

function render(){
 const v={start,map,station,lex:lexicon,badges}[S.screen]();
 document.getElementById('app').innerHTML=v+sheet();
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a],[data-st],[data-an]');if(!t)return;
 const a=t.dataset.a;
 if(t.dataset.st){S.screen='station';S.sel=t.dataset.st;S.toast=false;if(kids())S.earned[S.sel]=true;scrollTo(0,0)}
 else if(t.dataset.an){S.animal=t.dataset.an}
 else if(a==='kids'||a==='adults'){S.mode=a;S.screen='map'}
 else if(a==='mode'){S.mode=kids()?'adults':'kids'}
 else if(a==='next'){S.step=(S.step+1)%R.length;S.toast=false}
 else if(a==='badges'){S.screen='badges';scrollTo(0,0)}
 else if(a==='lex'){S.screen='lex';S.toast=false;scrollTo(0,0)}
 else if(a==='map'){S.screen='map';S.animal=null;scrollTo(0,0)}
 else if(a==='close'){S.animal=null}
 else if(a==='bgclose'){if(e.target!==t)return;S.animal=null}
 else if(a==='toast'){S.toast=!S.toast}
 render();
});
render();
</script>
</body>
</html>
